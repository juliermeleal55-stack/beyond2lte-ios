name: beyond2lte XNU BOOT build

on:
  workflow_dispatch:
  push:
    branches:
      - github-actions-builder

permissions:
  contents: read

concurrency:
  group: beyond2lte-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Build pinned XNU kernel (macOS)
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v4

      - name: Check Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]] || { echo "::error::The XNU job requires an Apple Silicon runner."; exit 1; }
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -version | grep -q 'Xcode 27.1' || { echo "::error::Xcode 27.1 is required by docs/build.md."; exit 1; }
          xcodebuild -showsdks | grep -q 'iOS 26.5' || { echo "::error::iPhoneOS SDK 26.5 is missing."; exit 1; }
          xcodebuild -showsdks | grep -q 'macOS 27' || { echo "::error::macOS 27 SDK is missing."; exit 1; }

      - name: Download and install matching KDK from public archive manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/kdk-source.env"
          import json
          import urllib.request

          manifest_url = "https://raw.githubusercontent.com/dortania/KdkSupportPkg/gh-pages/manifest.json"
          with urllib.request.urlopen(manifest_url, timeout=60) as response:
              entries = json.load(response)
          matches = [item for item in entries if item.get("build") == "25F71" and item.get("version") == "26.5"]
          if len(matches) != 1:
              raise SystemExit(f"Expected one KDK 26.5 build 25F71 entry, found {len(matches)}")
          item = matches[0]
          if not item.get("url", "").startswith("https://github.com/dortania/KdkSupportPkg/releases/"):
              raise SystemExit("KDK archive URL is not from the expected public mirror")
          print(f"KDK_URL={item['url']}")
          print(f"KDK_SHA256={item['sha256sum']}")
          PY
          source "$RUNNER_TEMP/kdk-source.env"
          curl --fail --location --retry 3 "$KDK_URL" -o "$RUNNER_TEMP/kdk-26.5-25F71.dmg"
          echo "$KDK_SHA256  $RUNNER_TEMP/kdk-26.5-25F71.dmg" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/kdk-mount"
          hdiutil attach "$RUNNER_TEMP/kdk-26.5-25F71.dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/kdk-mount"
          KDK_PACKAGES=()
          while IFS= read -r package; do KDK_PACKAGES+=("$package"); done < <(find "$RUNNER_TEMP/kdk-mount" -maxdepth 3 -name '*.pkg' -print | sort)
          if [[ "${#KDK_PACKAGES[@]}" -eq 0 ]]; then
            hdiutil detach "$RUNNER_TEMP/kdk-mount" || true
            echo "::error::The KDK disk image contains no installer packages."
            exit 1
          fi
          for package in "${KDK_PACKAGES[@]}"; do
            sudo installer -pkg "$package" -target /
          done
          hdiutil detach "$RUNNER_TEMP/kdk-mount"
          KDKROOT="/Library/Developer/KDKs/KDK_26.5_25F71.kdk"
          [[ -d "$KDKROOT" ]] || { echo "::error::The KDK installer did not create $KDKROOT"; find /Library/Developer/KDKs -maxdepth 2 -print 2>/dev/null || true; exit 1; }
          echo "KDKROOT=$KDKROOT" >> "$GITHUB_ENV"

      - name: Fetch and prepare pinned XNU
        run: |
          scripts/fetch-xnu.sh
          scripts/prepare-xnu.sh
          : "${KDKROOT:?KDKROOT must be provided by the KDK installation step}"
          [[ -d "$KDKROOT" ]] || { echo "::error::Installed KDKROOT does not exist: $KDKROOT"; exit 1; }
          export B2L_DEPSROOT="$RUNNER_TEMP/b2l-deps"
          export XNU_PATH="$GITHUB_WORKSPACE/xnu"
          scripts/prepare-apple-deps.sh
          echo "B2L_DEPSROOT=$B2L_DEPSROOT" >> "$GITHUB_ENV"

      - name: Compile standalone B2L kernel
        env:
          BUILD_JOBS: "4"
        run: |
          set -euo pipefail
          scripts/build-kernel.sh CWARNFLAGS=-w CXXWARNFLAGS=-w
          mkdir -p out/kernel
          image="$(find out/xnu -type f -name 'mach.development.b2l' -print -quit)"
          test -n "$image"
          cp "$image" out/kernel/mach.development.b2l
          test -s out/kernel/mach.development.b2l

      - name: Upload XNU kernel
        uses: actions/upload-artifact@v4
        with:
          name: b2l-xnu-kernel
          path: out/kernel/mach.development.b2l
          if-no-files-found: error
          retention-days: 7

  firmware:
    name: Build beyond2lte UEFI firmware (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout XNU builder
        uses: actions/checkout@v4
        with:
          path: xnu-builder

      - name: Checkout beyond2lte UEFI overlay
        uses: actions/checkout@v4
        with:
          repository: orhunnx/beyond2lte-uefi
          ref: f122c7024c5eeef2c8c78dfd08c62708c9ef823d
          path: b2l-uefi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git git-lfs python3 python3-venv python3-pip python3-git clang llvm lld nasm gcc-aarch64-linux-gnu mono-devel gettext locales gnupg ca-certificates curl acpica-tools device-tree-compiler rsync uuid-dev libssl-dev libuuid1 zlib1g-dev liblzma-dev

      - name: Clone Mu-Silicium and prepare the board overlay
        shell: bash
        run: |
          set -euo pipefail
          MU_COMMIT="fb4efb37b4ac289ce83ad94c7acb73defb87955c"
          git clone https://github.com/Project-Silicium/Mu-Silicium.git "$RUNNER_TEMP/Mu-Silicium"
          git -C "$RUNNER_TEMP/Mu-Silicium" checkout --detach "$MU_COMMIT"
          git -C "$RUNNER_TEMP/Mu-Silicium" submodule sync --recursive
          git -C "$RUNNER_TEMP/Mu-Silicium" submodule update --init --recursive
          test "$(git -C "$RUNNER_TEMP/Mu-Silicium" rev-parse HEAD)" = "$MU_COMMIT"
          cp -a b2l-uefi/mu-silicium-overlay/. "$RUNNER_TEMP/Mu-Silicium/"
          # Remove the unused memory-map counter that fails this pinned Clang -Werror build.
          python3 "$GITHUB_WORKSPACE/xnu-builder/scripts/patch-b2lgoster.py" \
            "$RUNNER_TEMP/Mu-Silicium/Platforms/Samsung/beyond2ltePkg/Applications/B2LGoster/B2LGoster.c"
          # Replace the board's stale pre-GpioBankLib S5E9820 DSC fragment with
          # the audited mapping for this pinned Mu-Silicium revision.
          install -D "$GITHUB_WORKSPACE/xnu-builder/patches/uefi/S5E9820Pkg.dsc.inc" \
            "$RUNNER_TEMP/Mu-Silicium/Silicon/Samsung/S5E9820Pkg/S5E9820Pkg.dsc.inc"
          # Fail early if any real Exynos 9820 implementation is missing.
          for source in \
            Silicon/Samsung/S5E9820Pkg/Library/GpioBankLib/GpioBankLib.inf \
            Silicon/Samsung/S5E9820Pkg/Library/PlatformSecLib/PlatformSecLib.inf \
            Silicon/Samsung/S5E9820Pkg/Library/ResetSystemLib/ResetSystemLib.inf \
            Silicon/Samsung/S5E9820Pkg/Library/PmicLib/PmicLib.inf \
            Silicon/Samsung/S5E9820Pkg/Library/UsiLib/UsiLib.inf \
            Silicon/Samsung/S5E9820Pkg/Library/HsI2cLib/HsI2cLib.inf \
            Silicon/Samsung/S5E9820Pkg/Library/PlatformUfsLib/PlatformUfsLib.inf; do
            test -s "$RUNNER_TEMP/Mu-Silicium/$source" || {
              echo "::error::Missing required S5E9820 source: $source"
              exit 1
            }
          done
          if grep -Eq '^[[:space:]]*(GpioLib|SpeedyLib)[|]' \
            "$RUNNER_TEMP/Mu-Silicium/Silicon/Samsung/S5E9820Pkg/S5E9820Pkg.dsc.inc"; then
            echo "::error::Obsolete S5E9820 library mapping detected."
            exit 1
          fi
          # The Samsung ACPI package is a separate overlay in the board repo.
          # build-boot-firmware.sh expects it at Mu-Silicium/Silicium-ACPI.
          test -d b2l-uefi/silicium-acpi-overlay/SoCs/Samsung
          mkdir -p "$RUNNER_TEMP/Mu-Silicium/Silicium-ACPI"
          cp -a b2l-uefi/silicium-acpi-overlay/. "$RUNNER_TEMP/Mu-Silicium/Silicium-ACPI/"
          test -d "$RUNNER_TEMP/Mu-Silicium/Silicium-ACPI/SoCs/Samsung"
          test -s "$RUNNER_TEMP/Mu-Silicium/Resources/DTBs/beyond2lte.dtb"
          test -s "$RUNNER_TEMP/Mu-Silicium/BootShim/BootShim.S"
          echo "MU_WORK_TREE=$RUNNER_TEMP/Mu-Silicium" >> "$GITHUB_ENV"

      - name: Install Mu Python dependencies and build native BaseTools
        shell: bash
        run: |
          set -euo pipefail
          cd "$MU_WORK_TREE"
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r pip-requirements.txt
          make -C Mu_Basecore/BaseTools
          for tool in clang llvm-lib llvm-rc lld-link; do
            command -v "$tool" >/dev/null || { echo "::error::Missing required LLVM tool: $tool"; exit 1; }
          done

      - name: Run board layout safety audits
        working-directory: b2l-uefi
        run: |
          python3 tools_uefi_layout_check.py
          python3 tools_reserved_memory_audit.py --check

      - name: Build XNU EFI loader and embed it in the 4 MiB firmware
        shell: bash
        working-directory: xnu-builder
        env:
          BUILD_JOBS: "4"
          CLANG_BIN: /usr/bin/
          PYTHON_COMMAND: python3
          CLANGPDB_AARCH64_PREFIX: aarch64-linux-gnu-
        run: |
          set -euo pipefail
          source "$MU_WORK_TREE/.venv/bin/activate"
          WORKSPACE="$MU_WORK_TREE" scripts/build-boot-firmware.sh
          LOADER="$MU_WORK_TREE/Build/B2LXnu/RELEASE_CLANGPDB/AARCH64/XnuLoader.efi"
          test -s "$LOADER"
          mapfile -t FDS < <(find "$MU_WORK_TREE/Build/beyond2ltePkg" -type f -name '*.fd' -size 4096k)
          if [[ "${#FDS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one 4 MiB beyond2lte firmware FD; found ${#FDS[@]}."
            find "$MU_WORK_TREE/Build" -type f -name '*.fd' -print
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/out/uefi/mu-package/BootShim" "$GITHUB_WORKSPACE/out/uefi/mu-package/Resources/Scripts" "$GITHUB_WORKSPACE/out/uefi/mu-package/Resources/DTBs"
          cp "${FDS[0]}" "$GITHUB_WORKSPACE/out/uefi/firmware.fd"
          cp "$LOADER" "$GITHUB_WORKSPACE/out/uefi/XnuLoader.efi"
          cp "$MU_WORK_TREE/BootShim/BootShim.S" "$GITHUB_WORKSPACE/out/uefi/mu-package/BootShim/"
          cp "$MU_WORK_TREE/Resources/Scripts/mkbootimg.py" "$GITHUB_WORKSPACE/out/uefi/mu-package/Resources/Scripts/"
          cp "$MU_WORK_TREE/Resources/DTBs/beyond2lte.dtb" "$GITHUB_WORKSPACE/out/uefi/mu-package/Resources/DTBs/"
          ls -lh "$GITHUB_WORKSPACE/out/uefi/"

      - name: Upload UEFI packaging inputs
        uses: actions/upload-artifact@v4
        with:
          name: b2l-uefi-inputs
          path: out/uefi/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package and verify Android BOOT image
    needs: [kernel, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v4

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          pattern: b2l-*
          path: incoming
          merge-multiple: false

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm python3

      - name: Assemble and verify BOOT image
        shell: bash
        run: |
          set -euo pipefail
          MU="$RUNNER_TEMP/mu-package"
          mkdir -p "$MU"
          cp -a incoming/b2l-uefi-inputs/mu-package/. "$MU/"
          KERNEL="$RUNNER_TEMP/mach.development.b2l"
          cp incoming/b2l-xnu-kernel/mach.development.b2l "$KERNEL"
          python3 scripts/package-boot.py --mu "$MU" --firmware incoming/b2l-uefi-inputs/firmware.fd --kernel "$KERNEL" --loader incoming/b2l-uefi-inputs/XnuLoader.efi --output-dir out/first-boot --max-image-bytes 67108864
          python3 scripts/package-boot.py --verify out/first-boot/boot.img
          sha256sum out/first-boot/boot.img | tee out/first-boot/SHA256SUMS.txt
          cat out/first-boot/manifest.json

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beyond2lte-ios-boot-image
          path: |
            out/first-boot/boot.img
            out/first-boot/manifest.json
            out/first-boot/SHA256SUMS.txt
            out/first-boot/beyond2lte-xnu-boot.tar
          if-no-files-found: error
          retention-days: 14
