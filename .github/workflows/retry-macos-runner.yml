name: Retry XNU when macOS runner allocation is cancelled

on:
  workflow_run:
    workflows:
      - beyond2lte XNU BOOT build
    branches:
      - github-actions-builder
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: xnu-runner-retry-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  retry-kernel-runner:
    if: github.event.workflow_run.run_attempt < 5
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retry only a pre-start macOS runner cancellation
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const attempt = Number(run.run_attempt || 1);

            if (attempt >= 5) {
              core.warning("Automatic XNU retry limit reached (5 attempts).");
              return;
            }

            const response = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
              filter: "latest"
            });
            const jobs = response.data.jobs;
            const kernel = jobs.find(job => job.name === "Build pinned XNU kernel (macOS)");

            if (!kernel || kernel.conclusion !== "cancelled") {
              core.info("XNU was not cancelled; no retry needed.");
              return;
            }
            if ((kernel.steps || []).some(step => step.status !== "queued" && step.status !== "pending")) {
              core.info("At least one XNU step started; this is not a runner-allocation cancellation.");
              return;
            }
            core.warning(`macOS runner allocation cancelled before XNU steps. Requesting XNU-only retry (attempt ${attempt + 1}/5).`);
            await github.request(
              "POST /repos/{owner}/{repo}/actions/jobs/{job_id}/rerun",
              { owner, repo, job_id: kernel.id }
            );
            core.info("GitHub accepted the XNU job rerun request.");
